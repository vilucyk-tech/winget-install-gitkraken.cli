name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck --version && shellcheck install-gk.sh tests/*.sh

  dry-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            method: deb
            setup: apt-get update -qq && apt-get install -y -qq curl lsb-release >/dev/null
          - image: debian:12
            method: deb
            setup: apt-get update -qq && apt-get install -y -qq curl >/dev/null
          - image: fedora:41
            method: rpm
            setup: "true"
          - image: archlinux:latest
            method: archive
            setup: "true"
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        run: ${{ matrix.setup }}
      - name: Dry-run install
        run: bash tests/dry-run.sh ${{ matrix.method }}
